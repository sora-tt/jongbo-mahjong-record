name: Deploy Frontend Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_9AtJbuzRPHtbHvJqPB4t3thz
      VERCEL_PROJECT_ID: prj_Kb9GjgAp01sRiSVUgVUcA7dyVBZH
      VERCEL_TOKEN: ${{ secrets.VERCEL_FRONTEND_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        run: pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: pnpm dlx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: pnpm dlx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"