name: Deploy Frontend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_SCOPE: soratomitadevelop-4383s-projects
      VERCEL_PROJECT_NAME: jongbo-mahjong-record-frontend
      VERCEL_PROJECT_ID: prj_Kb9GjgAp01sRiSVUgVUcA7dyVBZH
      VERCEL_TOKEN: ${{ secrets.VERCEL_FRONTEND_TOKEN }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Firebase env
        run: |
          node -e "const required=['NEXT_PUBLIC_FIREBASE_API_KEY','NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN','NEXT_PUBLIC_FIREBASE_PROJECT_ID','NEXT_PUBLIC_FIREBASE_APP_ID']; for (const key of required) { if (!process.env[key]) { throw new Error(`${key} is missing`); } } console.log('Firebase env ok');"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link to Vercel project
        run: pnpm dlx vercel link --yes --scope="$VERCEL_SCOPE" --project="$VERCEL_PROJECT_NAME" --token="$VERCEL_TOKEN"

      - name: Pull Vercel project settings
        run: pnpm dlx vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --project="$VERCEL_PROJECT_NAME" --token="$VERCEL_TOKEN"

      - name: Build for production
        run: pnpm dlx vercel build --prod --scope="$VERCEL_SCOPE" --project="$VERCEL_PROJECT_NAME" --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: pnpm dlx vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --project="$VERCEL_PROJECT_NAME" --token="$VERCEL_TOKEN"