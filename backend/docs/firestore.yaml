                maximum:
                  type: number
                  nullable: true
                minimum:
                  type: number
                  nullable: true
                median:
                  type: number
                  nullable: true
                populationStandardDeviation:
                  type: number
                  nullable: true
                positive:
                  type: object
                  fields:
                    count: number
                    denominator: number
                    rate:
                      type: number
                      nullable: true
                negative:
                  type: object
                  fields:
                    count: number
                    denominator: number
                    rate:
                      type: number
                      nullable: true
                even:
                  type: object
                  fields:
                    count: number
                    denominator: number
                    rate:
                      type: number
