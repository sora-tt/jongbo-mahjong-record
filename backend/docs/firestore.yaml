                  topRate:
                    type: number
                    nullable: true
                  topTwoRate:
                    type: number
                    nullable: true
                  topThreeRate:
                    type: number
                    nullable: true
                  lastRate:
                    type: number
                    nullable: true
                  lastAvoidanceRate:
                    type: number
                    nullable: true
            rawScore:
              type: object
